name: LapisCube web client
on:
  push:
    branches: [testing-cube]
    paths: ['clients/lapiscube/**', 'src/**', 'include/**', 'build.sh', 'build_client.sh', 'build_clientsrv.sh', 'build-alpine.sh', 'build-debian.sh', 'build-experiments-alpine.sh', 'build-experiments-debian.sh', '.github/workflows/lapiscube-web.yml']
  pull_request:
    paths: ['clients/lapiscube/**', 'src/**', 'include/**', 'build.sh', 'build_client.sh', 'build_clientsrv.sh', 'build-alpine.sh', 'build-debian.sh', 'build-experiments-alpine.sh', 'build-experiments-debian.sh', '.github/workflows/lapiscube-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alpine:
    name: Alpine web client/server (${{ matrix.arch }} host)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Enable RISC-V emulation
        if: matrix.arch == 'riscv64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: riscv64
      - name: Build, test and package on Alpine
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env TARGET_ARCH alpine:3.23.6 sh -eu -c '
              # The checkout belongs to the host runner, not container root.
              apk add --no-cache git
              git config --global --add safe.directory /work
              git config --global --add safe.directory /work/clients/lapiscube/engine
              ./build_clientsrv.sh --install-deps --test --arch "$TARGET_ARCH"
              # Reuse the pinned source/npm cache with fetching disabled.
              ./build_client.sh --no-fetch --arch "$TARGET_ARCH"
              test ! -e lapis-obsidian
              test ! -e clients/lapiscube/build/engine/LapisCube
              test ! -e clients/lapiscube/build/LapisCube-linux.zip
              # Reusing a validated bundle needs no browser rebuild or downloads.
              ./build_clientsrv.sh --prebuilt clients/lapiscube/build/webclient \
                --static --test --no-fetch --arch "$TARGET_ARCH"
              cd clients/lapiscube/build
              sha256sum -c LapisCube-web.sha256
              sha256sum -c "LapisCube-web-server-alpine-$TARGET_ARCH.sha256"
              # Validate the final archive, including executable permissions.
              tar -xzf "LapisCube-web-server-alpine-$TARGET_ARCH.tar.gz"
              test -x "LapisCube-web-server-alpine-$TARGET_ARCH/start.sh"
              test -x "LapisCube-web-server-alpine-$TARGET_ARCH/lapis-obsidian"
              python3 ../tools/install_web.py \
                "LapisCube-web-server-alpine-$TARGET_ARCH/webclient" \
                "LapisCube-web-server-alpine-$TARGET_ARCH/webclient"
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-web-alpine-${{ matrix.arch }}
          path: |
            clients/lapiscube/build/LapisCube-web.zip
            clients/lapiscube/build/LapisCube-web.buildinfo.txt
            clients/lapiscube/build/LapisCube-web.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-web-server-alpine-${{ matrix.arch }}
          path: |
            clients/lapiscube/build/LapisCube-web-server-alpine-${{ matrix.arch }}.tar.gz
            clients/lapiscube/build/LapisCube-web-server-alpine-${{ matrix.arch }}.buildinfo.txt
            clients/lapiscube/build/LapisCube-web-server-alpine-${{ matrix.arch }}.sha256
          if-no-files-found: error
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Emscripten and browser test tools
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git clients/lapiscube/build/emsdk
          clients/lapiscube/build/emsdk/emsdk install 4.0.23
          clients/lapiscube/build/emsdk/emsdk activate 4.0.23
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Build default and opt-in servers
        run: |
          ./build.sh
          cp lapis-obsidian clients/lapiscube/build/default-server
          source clients/lapiscube/build/emsdk/emsdk_env.sh
          ./build-debian.sh
          cp lapis-obsidian clients/lapiscube/build/web-server
          cp clients/lapiscube/build/default-server lapis-obsidian
      - name: Protocol, malformed input and transport acceptance
        run: |
          make -C clients/lapiscube test web-test
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -fsanitize=address,undefined -fno-pie -no-pie clients/lapiscube/tests/web_host.c -o clients/lapiscube/build/web-host-sanitize
          clients/lapiscube/build/web-host-sanitize
      - name: Desktop and touch browser acceptance
        env:
          LAPIS_WEB_REVIEW_IMAGES: '1'
        run: python3 clients/lapiscube/tests/web_browser.py
      - name: Build experimental Debian presets with the validated browser bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev ca-certificates
          ./build-experiments-debian.sh --prebuilt webclient
          LAPIS_ENABLE_EXPERIMENTAL_AUTH=0 ./build-experiments-debian.sh --prebuilt webclient
          cp clients/lapiscube/build/default-server lapis-obsidian
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-web
          path: clients/lapiscube/build/LapisCube-web.zip
      - name: Bundle optional Linux host
        run: |
          mkdir -p clients/lapiscube/build/LapisCube-web-server
          cp clients/lapiscube/build/web-server clients/lapiscube/build/LapisCube-web-server/lapis-obsidian
          cp -r webclient clients/lapiscube/build/LapisCube-web-server/
          cp LICENSE clients/lapiscube/build/LapisCube-web-server/LICENSE-server
          cp NOTICE.md clients/lapiscube/build/LapisCube-web-server/NOTICE-server.md
          printf 'Corresponding server source: https://github.com/aksulightning/lapisobsidian/tree/%s\n' "$(git rev-parse HEAD)" > clients/lapiscube/build/LapisCube-web-server/SOURCE-server.txt
          cp clients/lapiscube/docs/web.md clients/lapiscube/build/LapisCube-web-server/README.md
          tar -C clients/lapiscube/build -czf clients/lapiscube/build/LapisCube-web-server-linux.tar.gz LapisCube-web-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-web-server-linux
          path: clients/lapiscube/build/LapisCube-web-server-linux.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: LapisCube-web-evidence
          path: |
            clients/lapiscube/build/web-evidence
            clients/lapiscube/build/web-transport-results.json
            clients/lapiscube/build/web-probe-*.log
