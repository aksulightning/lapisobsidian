name: Publish dev-2026.10.08

on:
  push:
    branches: [release/dev-2026.10.08]
    paths:
      - '.github/workflows/dev-release.yml'
      - '.github/releases/dev-2026.10.08.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dev-2026.10.08
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aksulightning/lapisobsidian' && github.ref == 'refs/heads/release/dev-2026.10.08'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 79f3b101bc71bb4b8c82f375f2ea921db6e79cc7
      SOURCE_RUN: '37746522567'
      RELEASE_TAG: dev-2026.10.08
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify source build
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GH_REPO" '
            .head_sha == $sha and .repository.full_name == $repo and
            .event == "push" and .path == ".github/workflows/build.yml" and
            .status == "completed" and .conclusion == "success"
          ' run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?filter=latest&per_page=100" > jobs.json
          jq -e '.total_count == 6 and (.jobs | all(.conclusion == "success"))' jobs.json
      - name: Download and verify tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 riscv64; do
            for variant in native web; do
              name="lapis-obsidian-alpine-$arch-$variant"
              directory="download/$name"
              gh run download "$SOURCE_RUN" --name "$name" --dir "$directory"
              (cd "$directory" && sha256sum --check SHA256SUMS)
              grep -Fx "Commit: $SOURCE_SHA" "$directory/BUILDINFO.txt"
              grep -Fx "Architecture: $arch" "$directory/BUILDINFO.txt"
              grep -Fx "Variant: $variant" "$directory/BUILDINFO.txt"
              feature=0
              if [ "$variant" = web ]; then feature=1; fi
              grep -Fx "LAPIS_OBSIDIAN_WEB_CLIENT=$feature" "$directory/BUILDINFO.txt"
              cp "$directory/$name.tar.gz" dist/
              cp "$directory/BUILDINFO.txt" "dist/$name.buildinfo.txt"
              if [ -f dist/source.tar.gz ]; then
                cmp dist/source.tar.gz "$directory/source.tar.gz"
              else
                cp "$directory/source.tar.gz" dist/source.tar.gz
              fi
            done
          done
          (cd dist && sha256sum -- *.tar.gz *.buildinfo.txt > SHA256SUMS)
      - name: Stage release with all assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/git/refs" --method POST \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA"
          gh release create "$RELEASE_TAG" dist/* \
            --target "$SOURCE_SHA" --title "Lapis Obsidian $RELEASE_TAG" \
            --notes-file ".github/releases/$RELEASE_TAG.md" \
            --verify-tag --draft --prerelease --latest=false
      - name: Verify uploaded assets and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          assert release['draft'] and release['prerelease']
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          assets = {asset['name']: asset for asset in release['assets']}
          files = list(Path('dist').iterdir())
          assert len(files) == len(assets) == 10
          assert set(assets) == {path.name for path in files}
          for path in files:
              asset = assets[path.name]
              assert asset['state'] == 'uploaded'
              assert asset['size'] == path.stat().st_size
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              assert asset['digest'] == digest, path.name
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,tagName
