name: LapisCube native client
on:
  push:
    branches: [testing-cube]
    paths: ['clients/lapiscube/**', 'build_client.sh', '.github/workflows/lapiscube.yml']
  pull_request:
    paths: ['clients/lapiscube/**', 'build_client.sh', '.github/workflows/lapiscube.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alpine:
    name: Alpine client ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Enable RISC-V emulation
        if: matrix.arch == 'riscv64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: riscv64
      - name: Build, test and package on Alpine
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env TARGET_ARCH alpine:3.23.6 sh -eu -c '
              # The checkout belongs to the host runner, not container root.
              apk add --no-cache git
              git config --global --add safe.directory /work
              git config --global --add safe.directory /work/clients/lapiscube/engine
              ./build_client.sh --install-deps --test --no-fetch --arch "$TARGET_ARCH"
              cd clients/lapiscube/build
              sha256sum -c "LapisCube-alpine-$TARGET_ARCH.sha256"
            '
      - name: Exercise the packaged Alpine client
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            alpine:3.23.6 sh -eu -c '
              ./build_client.sh --deps-only
              apk add --no-cache xvfb imagemagick unzip
              ./build-alpine.sh
              make -C clients/lapiscube build/survival-fixture
              python3 clients/lapiscube/tests/windowed.py
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-alpine-${{ matrix.arch }}
          path: |
            clients/lapiscube/build/LapisCube-alpine-${{ matrix.arch }}.zip
            clients/lapiscube/build/LapisCube-alpine-${{ matrix.arch }}.buildinfo.txt
            clients/lapiscube/build/LapisCube-alpine-${{ matrix.arch }}.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && matrix.arch == 'x86_64'
        with:
          name: LapisCube-alpine-windowed-evidence
          path: clients/lapiscube/build/windowed-evidence
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl-dev xvfb imagemagick unzip
      - run: ./build.sh
      - run: make -C clients/lapiscube test sanitize integration survival progression travel native-smoke
      - run: make -C clients/lapiscube native package
      - run: python3 clients/lapiscube/tests/windowed.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-linux
          path: clients/lapiscube/build/LapisCube-linux.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: LapisCube-linux-windowed-evidence
          path: clients/lapiscube/build/windowed-evidence
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: make -C clients/lapiscube windows
      - run: python3 clients/lapiscube/tools/package.py --platform windows
      - run: python3 clients/lapiscube/tools/check_package.py clients/lapiscube/build/LapisCube-windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-windows
          path: clients/lapiscube/build/LapisCube-windows.zip
