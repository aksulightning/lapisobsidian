name: LapisCube native client
on:
  push:
    branches: [testing-cube]
    paths: ['clients/lapiscube/**', '.github/workflows/lapiscube.yml']
  pull_request:
    paths: ['clients/lapiscube/**', '.github/workflows/lapiscube.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl-dev
      - run: ./build.sh
      - run: make -C clients/lapiscube test sanitize integration survival progression native-smoke
      - run: make -C clients/lapiscube native package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-linux
          path: clients/lapiscube/build/LapisCube-linux.zip
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: make -C clients/lapiscube windows
      - run: python3 clients/lapiscube/tools/package.py --platform windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LapisCube-windows
          path: clients/lapiscube/build/LapisCube-windows.zip
