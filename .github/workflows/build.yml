name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ./tests/run.sh
      - run: SANITIZE=1 ./tests/run.sh
      - run: node build_registries.js && git diff --exit-code -- src/registries.c include/registries.h
