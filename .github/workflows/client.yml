name: Client checks
on:
  push:
    branches: [testing-client]
  pull_request:
    paths: ['client/**', 'src/**', 'include/**', 'build.sh', 'docs/lapisclient-protocol.md', '.github/workflows/client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-browser-checks
          path: client/test-results/*.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lapis-obsidian-client-web
          path: client/dist/
