name: Client checks
on:
  push:
    branches: [testing-client]
  pull_request:
    paths: ['client/**', 'docs/client-*.md', '.github/workflows/client.yml', 'include/protocol.h', 'generated/registry_snapshot.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run build
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-browser-checks
          path: client/test-results/*.*
          if-no-files-found: ignore
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: lapis-obsidian-client-${{ runner.os }}
          path: client/release/
          retention-days: 14
