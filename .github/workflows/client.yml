name: Client checks
on:
  push:
    branches: [testing-client]
  pull_request:
    paths: ['client/**', 'docs/client-*.md', '.github/workflows/client.yml', 'include/protocol.h']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: npm test
      - run: npm run build:bridge
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-browser-checks
          path: client/test-results/
          if-no-files-found: ignore
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: npm ci
      - run: npm run build
      - name: Build standalone application (no test-only features)
        run: cargo build --locked -p lapis-obsidian-client --release
      - name: Linux window startup and clean exit
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a dbus-run-session -- python3 tests/native-startup.py
      - name: Include license and matching source
        shell: bash
        run: |
          mkdir -p release-preview
          cp ../LICENSE ../NOTICE.md README.md release-preview/
          git archive --format=tar.gz --prefix=lapis-obsidian-source/ HEAD > release-preview/source.tar.gz
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/lapis-obsidian-client.exe release-preview/
          else
            cp target/release/lapis-obsidian-client release-preview/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lapis-obsidian-client-preview-${{ runner.os }}
          path: client/release-preview/
          retention-days: 14
